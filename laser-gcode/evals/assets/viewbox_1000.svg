<?xml version="1.0" encoding="UTF-8"?>
<!-- A square drawn in a 1000-unit user space. The frame must come from the viewBox,
     otherwise a 50mm target turns into 500mm of travel. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 1000 1000">
  <rect x="0" y="0" width="1000" height="1000" fill="none" stroke="#000" stroke-width="2"/>
</svg>
